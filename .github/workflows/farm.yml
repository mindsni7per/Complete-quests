name: Discord Quest Farmer

on:
  schedule:
    - cron: '*/2 * * * *' # Runs every 2 minutes now
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node orb_farmer.js
